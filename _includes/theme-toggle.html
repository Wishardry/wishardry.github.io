<button class="theme-toggle" id="theme-toggle" onclick="toggleTheme()" aria-label="Toggle dark mode">
  <span class="theme-toggle-light">☀</span>
  <span class="theme-toggle-dark">☽</span>
</button>

<script>
  // Ensure body class is added on page load if dark mode is enabled
  document.addEventListener('DOMContentLoaded', function() {
    const theme = localStorage.getItem('theme');
    if (theme === 'dark') {
      document.body.classList.add('dark-mode');
      
      // Remove critical styles once main CSS is loaded
      setTimeout(() => {
        const criticalStyle = document.getElementById('dark-mode-critical');
        if (criticalStyle) {
          criticalStyle.remove();
        }
      }, 100);
    }
  });
  
  function toggleTheme() {
    const html = document.documentElement;
    const body = document.body;
    
    if (body.classList.contains('dark-mode')) {
      // Switch to light mode
      html.classList.remove('dark-mode');
      body.classList.remove('dark-mode');
      localStorage.setItem('theme', 'light');
      
      // Remove critical style if it exists
      const criticalStyle = document.getElementById('dark-mode-critical');
      if (criticalStyle) {
        criticalStyle.remove();
      }
    } else {
      // Switch to dark mode
      html.classList.add('dark-mode');
      body.classList.add('dark-mode');
      localStorage.setItem('theme', 'dark');
    }
  }
</script>
