<button class="theme-toggle" id="theme-toggle" onclick="toggleTheme()" aria-label="Toggle dark mode">
  <span class="theme-toggle-light">☀</span>
  <span class="theme-toggle-dark">☽</span>
</button>

<script>
  // Theme is already applied by blocking script in head.html
  // This just handles the toggle functionality
  
  function toggleTheme() {
    const html = document.documentElement;
    const body = document.body;
    
    if (body.classList.contains('dark-mode')) {
      // Switch to light mode
      html.classList.remove('dark-mode');
      body.classList.remove('dark-mode');
      localStorage.setItem('theme', 'light');
    } else {
      // Switch to dark mode
      html.classList.add('dark-mode');
      body.classList.add('dark-mode');
      localStorage.setItem('theme', 'dark');
    }
  }
</script>
